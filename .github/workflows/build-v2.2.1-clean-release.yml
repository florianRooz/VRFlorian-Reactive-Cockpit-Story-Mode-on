name: Build V2.2.1 clean release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-v2.2.1-clean-release.yml
      - release/v2.2.1/**

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://github.com/florianRooz/VRFlorian-Reactive-Cockpit-Story-Mode-on/releases/download/v2.2.0/VRFlorian_Reactive_Cockpit_V2.2.0.zip
      BASE_SHA256: 4473e1fc355d564942a0f70ab67c530ed957f570ca31cb09aa978544f996dbe9
      UPDATE_SHA256: 10040bbefb0681b4ca89fe8c9354447d2448badc2119012a572b7c762057ab2c
      OUTPUT_NAME: VRFlorian_Reactive_Cockpit_V2.2.1.zip

    steps:
      - name: Check out release sources
        uses: actions/checkout@v4

      - name: Download and verify published V2.2.0 baseline
        run: |
          set -euo pipefail
          curl --location --fail --show-error --output base-v2.2.0.zip "$BASE_URL"
          echo "$BASE_SHA256  base-v2.2.0.zip" | sha256sum --check --strict
          echo "$UPDATE_SHA256  updates/VRFlorian_Reactive_Cockpit_V2.2.1_UPDATE_R2.zip" | sha256sum --check --strict

      - name: Assemble V2.2.1 clean installer
        run: |
          set -euo pipefail
          mkdir build update-payload
          unzip -q base-v2.2.0.zip -d build
          unzip -q updates/VRFlorian_Reactive_Cockpit_V2.2.1_UPDATE_R2.zip -d update-payload
          cp -a update-payload/'Reactive Cockpit Files'/. build/'VRFlorian Reactive Cockpit/Reactive Cockpit Files'/
          cp release/v2.2.1/README.txt build/'VRFlorian Reactive Cockpit/README.txt'
          cp release/v2.2.1/CHANGELOG.txt build/'VRFlorian Reactive Cockpit/CHANGELOG.txt'
          cp release/v2.2.1/PLAYER_BUILD_VALIDATION.txt build/'VRFlorian Reactive Cockpit/Reactive Cockpit Files/PLAYER_BUILD_VALIDATION.txt'

      - name: Validate clean installer and story media
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/VRFlorian Reactive Cockpit/Reactive Cockpit Files"
          export PYTHONDONTWRITEBYTECODE=1
          cd "$app"
          python3 VALIDATE_CLEAN_PLAYER_BUILD.py
          if grep -Eq '\$Pid\b|\$PID\b' UPDATE_REACTIVE_COCKPIT.ps1; then
            echo 'Reserved PowerShell PID variable remains in updater.' >&2
            exit 1
          fi
          cd 'Story Platform'
          python3 -m unittest discover -s tests -v
          python3 platform.py validate stories/mission_01/graph.json
          python3 platform.py validate stories/mission_02/graph.json
          python3 platform.py media-check stories/mission_01/graph.json
          python3 platform.py media-check stories/mission_02/graph.json
          echo '58e5b0373a0557525a5ec8fa867580bb9f1c67557b3ed574aa4c92edd11de92f  stories/mission_01/graph.json' | sha256sum --check --strict
          echo '2a4dca26b3cf9c33124e7c553acae70160d97aa4475022d6fcd660da6d1a53a3  stories/mission_02/graph.json' | sha256sum --check --strict

      - name: Reject generated player state
        run: |
          set -euo pipefail
          if find build/'VRFlorian Reactive Cockpit' -type f \( -name '*.pyc' -o -name '*.tmp' -o -name '*.log' -o -name '*.jsonl' \) -print | grep -q .; then
            echo 'Generated cache, log, telemetry, or temporary files found.' >&2
            exit 1
          fi
          if find build/'VRFlorian Reactive Cockpit' -type f -path '*/runtime/*' -print | grep -q .; then
            echo 'Runtime-state files found.' >&2
            exit 1
          fi

      - name: Package and verify V2.2.1
        run: |
          set -euo pipefail
          cd build
          zip -q -r "$GITHUB_WORKSPACE/$OUTPUT_NAME" 'VRFlorian Reactive Cockpit'
          cd "$GITHUB_WORKSPACE"
          unzip -tq "$OUTPUT_NAME"
          sha256sum "$OUTPUT_NAME" > "$OUTPUT_NAME.sha256.txt"
          stat --format='size_bytes=%s' "$OUTPUT_NAME" >> "$OUTPUT_NAME.sha256.txt"
          cat "$OUTPUT_NAME.sha256.txt"

      - name: Create or refresh V2.2.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.1 >/dev/null 2>&1; then
            gh release upload v2.2.1 "$OUTPUT_NAME" "$OUTPUT_NAME.sha256.txt" --clobber
            gh release edit v2.2.1 --title 'VRFlorian Reactive Cockpit V2.2.1 — Open Test' --notes-file release/v2.2.1/RELEASE_NOTES.md --prerelease
          else
            gh release create v2.2.1 "$OUTPUT_NAME" "$OUTPUT_NAME.sha256.txt" --target "$GITHUB_SHA" --title 'VRFlorian Reactive Cockpit V2.2.1 — Open Test' --notes-file release/v2.2.1/RELEASE_NOTES.md --prerelease
          fi
